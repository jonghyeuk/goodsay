name: Deploy Goodsay to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-hosting-education-news-site
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://education-news-site.web.app
    steps:
      - uses: actions/checkout@v4
      - name: Check Firebase credential configuration
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDUCATION_NEWS_SITE }}
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::error::Add the repository Actions secret FIREBASE_SERVICE_ACCOUNT_EDUCATION_NEWS_SITE before deploying. See docs/firebase.md.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDUCATION_NEWS_SITE }}
          projectId: education-news-site
          channelId: live
          disableComment: true
          firebaseToolsVersion: 15.9.0
